# Phase 1 only: no network exporter, API keys, or Langfuse writes.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32

  transform/workbuddy:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - set(attributes["langfuse.observation.type"], "span")
          - set(attributes["langfuse.observation.type"], "agent") where attributes["span.type"] == "interaction" or attributes["span.type"] == "subagent"
          - set(attributes["langfuse.observation.type"], "tool") where attributes["span.type"] == "tool" or attributes["span.type"] == "mcp_call"
          - set(attributes["langfuse.observation.type"], "generation") where attributes["span.type"] == "model_stream"
          - set(attributes["langfuse.session.id"], attributes["conversation.id"])
          - set(attributes["langfuse.session.id"], attributes["workbuddy.session.id"]) where attributes["workbuddy.session.id"] != nil
          - set(attributes["langfuse.session.id"], attributes["workbuddy.session_id"]) where attributes["workbuddy.session_id"] != nil
          - set(attributes["langfuse.session.id"], attributes["gen_ai.session.id"]) where attributes["gen_ai.session.id"] != nil
          - set(attributes["langfuse.observation.model.name"], attributes["model.id"]) where attributes["span.type"] == "model_stream"
          - set(attributes["langfuse.observation.model.name"], attributes["workbuddy.model"]) where attributes["span.type"] == "model_stream" and attributes["langfuse.observation.model.name"] == nil
          - set(attributes["langfuse.observation.model.name"], attributes["gen_ai.request.model"]) where attributes["span.type"] == "model_stream" and attributes["gen_ai.request.model"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.usage.prompt_tokens"]) where attributes["span.type"] == "model_stream" and attributes["gen_ai.usage.input_tokens"] == nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.usage.completion_tokens"]) where attributes["span.type"] == "model_stream" and attributes["gen_ai.usage.output_tokens"] == nil
          - delete_matching_keys(attributes, "^gen_ai\\.usage\\.") where attributes["span.type"] != "model_stream"
          - set(attributes["workbuddy.langfuse.source"], "native-preview") where attributes["workbuddy.langfuse.source"] == nil
          # Keep model_request as a diagnostic span, never as a billable generation.
          # Strict metadata allowlist: discard prompt/output, URLs, paths and resource identity.
          - keep_keys(attributes, ["span.type", "langfuse.observation.type", "langfuse.session.id", "langfuse.observation.model.name", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "tool.call_id", "tool_name", "mcp.tool", "mcp.server", "conversation.request_id", "workbuddy.prompt_request_id", "message.id", "workbuddy.message_id", "conversation.cancelled", "workbuddy.langfuse.source"])
          - set(name, attributes["span.type"]) where attributes["span.type"] != nil
          - set(name, "unclassified") where attributes["span.type"] == nil
          - set(status.message, "")
          - set(trace_state, "")
          - set(attributes["workbuddy.langfuse.phase"], "1")
          - keep_keys(resource.attributes, ["service.name", "service.version"])
          - keep_keys(instrumentation_scope.attributes, [])
      - context: spanevent
        statements:
          - set(name, "content-omitted")
          - keep_keys(attributes, [])

  batch:
    timeout: 500ms
    send_batch_size: 128

exporters:
  file/preview:
    path: /data/traces.jsonl
    format: json
    append: true
    flush_interval: 500ms

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/workbuddy, batch]
      exporters: [file/preview]
