# Test-only pipeline: JSON test input -> standard OTLP protobuf exporter -> real receiver.
receivers:
  otlp/probe:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
exporters:
  otlp_http/probe:
    endpoint: http://127.0.0.1:4318
    retry_on_failure:
      enabled: false
service:
  pipelines:
    traces/probe:
      receivers: [otlp/probe]
      exporters: [otlp_http/probe]
